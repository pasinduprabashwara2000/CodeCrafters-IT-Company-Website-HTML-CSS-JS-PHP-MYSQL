<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141a3d"/>
      <stop offset="100%" stop-color="#0b1028"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4270"/>
      <stop offset="100%" stop-color="#232a52"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4267ff"/>
      <stop offset="100%" stop-color="#7a4dff"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef1fb"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#28409e" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- soft glow backdrop -->
  <ellipse cx="350" cy="470" rx="230" ry="28" fill="#2032a0" opacity="0.18"/>

  <!-- floating browser card (back) -->
  <g transform="rotate(-6 180 190)">
    <rect x="70" y="120" width="230" height="150" rx="16" fill="url(#browserGrad)" filter="url(#softShadow)"/>
    <circle cx="92" cy="140" r="4.5" fill="#ff6b6b"/>
    <circle cx="107" cy="140" r="4.5" fill="#ffd166"/>
    <circle cx="122" cy="140" r="4.5" fill="#4caf50"/>
    <rect x="86" y="158" width="80" height="46" rx="6" fill="#dfe6ff"/>
    <rect x="174" y="158" width="102" height="10" rx="4" fill="#c8d2f5"/>
    <rect x="174" y="176" width="102" height="8" rx="4" fill="#dbe1f7"/>
    <rect x="174" y="190" width="70" height="8" rx="4" fill="#dbe1f7"/>
    <rect x="86" y="214" width="190" height="8" rx="4" fill="#e5eaf9"/>
    <rect x="86" y="230" width="140" height="8" rx="4" fill="#e5eaf9"/>
  </g>

  <!-- floating AI / gear chip (back) -->
  <g transform="rotate(10 560 160)">
    <rect x="500" y="90" width="112" height="112" rx="24" fill="url(#chipGrad)" filter="url(#softShadow)"/>
    <circle cx="556" cy="146" r="24" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
    <circle cx="556" cy="146" r="9" fill="#ffffff"/>
  </g>

  <!-- laptop base -->
  <path d="M170 470 L530 470 L558 500 L142 500 Z" fill="url(#baseGrad)"/>
  <rect x="248" y="474" width="104" height="7" rx="3.5" fill="#151a3a"/>

  <!-- laptop screen -->
  <g filter="url(#softShadow)">
    <rect x="185" y="210" width="330" height="266" rx="18" fill="#1c2352"/>
    <rect x="200" y="224" width="300" height="238" rx="10" fill="url(#screenGrad)"/>
  </g>

  <!-- window dots on screen -->
  <circle cx="216" cy="240" r="4" fill="#ff6b6b"/>
  <circle cx="230" cy="240" r="4" fill="#ffd166"/>
  <circle cx="244" cy="240" r="4" fill="#4caf50"/>

  <!-- code lines -->
  <rect x="216" y="258" width="60" height="7" rx="3.5" fill="#7a4dff"/>
  <rect x="282" y="258" width="90" height="7" rx="3.5" fill="#e6e9ff" opacity="0.85"/>
  <rect x="228" y="276" width="130" height="7" rx="3.5" fill="#20cfff"/>
  <rect x="228" y="294" width="80" height="7" rx="3.5" fill="#e6e9ff" opacity="0.65"/>
  <rect x="216" y="312" width="45" height="7" rx="3.5" fill="#7a4dff"/>
  <rect x="266" y="312" width="110" height="7" rx="3.5" fill="#e6e9ff" opacity="0.85"/>
  <rect x="228" y="330" width="150" height="7" rx="3.5" fill="#4267ff"/>
  <rect x="228" y="348" width="60" height="7" rx="3.5" fill="#e6e9ff" opacity="0.6"/>
  <rect x="216" y="366" width="70" height="7" rx="3.5" fill="#7a4dff"/>
  <rect x="292" y="366" width="95" height="7" rx="3.5" fill="#e6e9ff" opacity="0.85"/>
  <rect x="228" y="384" width="120" height="7" rx="3.5" fill="#20cfff"/>

  <!-- cursor blink block -->
  <rect x="228" y="402" width="8" height="14" rx="2" fill="#4267ff"/>

  <!-- </> badge floating on screen corner -->
  <g transform="translate(420 380)">
    <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#chipGrad)" filter="url(#softShadow)"/>
    <text x="32" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">&lt;/&gt;</text>
  </g>

  <!-- small floating dots for depth -->
  <circle cx="120" cy="360" r="6" fill="#20cfff" opacity="0.8"/>
  <circle cx="600" cy="330" r="8" fill="#7a4dff" opacity="0.6"/>
  <circle cx="130" cy="230" r="5" fill="#4267ff" opacity="0.7"/>
</svg>
